# CI on every push: tests and a Terraform check. CD on main: build the image and push it to ghcr.io (private); the
# instance pulls a new image within about 2 minutes, with a read-only package token, and restarts the app. GitHub holds
# no API keys and no AWS access: the app's secrets live in AWS SSM Parameter Store, read only by the instance.
# See README, "Deployment".
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group ui pytest tests/ -q
        env:
          TRACING: "off"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false && terraform -chdir=infra validate

  image:  # built and checked on every push; pushed to ghcr.io from main, or from a manual run (to try a branch)
    needs: [test, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t app .
      - name: Check the image holds no secrets
        run: |
          docker run --rm --entrypoint sh app -c '
            found=$(find / -xdev -name ".env" -o -name ".env.*" -not -name ".env.example" 2>/dev/null | grep -v "^/proc")
            keys=$(grep -rlE "tvly-[A-Za-z0-9_-]{20,}|sk-lf-[A-Za-z0-9-]{20,}" /app 2>/dev/null)
            [ -z "$found$keys" ] || { echo "possible secrets in the image: $found $keys"; exit 1; }'
      - if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to ghcr.io
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        run: |
          docker tag app "$IMAGE:$GITHUB_SHA" && docker tag app "$IMAGE:latest"
          docker push --all-tags "$IMAGE"
