[project]
name = "fin-research-agent"
version = "0.1.0"
description = "Cited company-research agent for financial analysts (Tavily + SEC EDGAR + Nebius), with an offline eval harness."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-nebius>=0.1.0",
    "langchain-tavily>=0.2.0",
    "tavily-python>=0.7.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "langchain-openai>=1.6",
]

[dependency-groups]
dev = ["pytest>=8"]
ui = [
    "chainlit>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
